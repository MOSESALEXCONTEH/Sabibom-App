def args = ["-Xlint:deprecation"]

group 'com.eyedeadevelopment.fluttertts'
version '1.0-SNAPSHOT'

// NOTE (SabiBom vendored fork): The upstream flutter_tts (4.2.5) still applies
// the legacy Kotlin Gradle Plugin (`kotlin-android`), which triggers the AGP 9
// "plugins that apply KGP" build warning. Upstream has not shipped a fix yet, so
// this vendored copy removes the explicit KGP application and lets Flutter's
// built-in Kotlin support compile the plugin sources. Remove this fork once a
// KGP-free flutter_tts is published and bump the pubspec dependency instead.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(args)
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    if (project.android.hasProperty("namespace")) {
        namespace 'com.eyedeadevelopment.fluttertts'
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Align Kotlin (Built-in Kotlin / AGP) with this module's Java target so
// compileDebugJavaWithJavac and compileDebugKotlin do not disagree.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

repositories {
    mavenCentral()
}
