name: sabibom
description: "SabiBom - AI Business Operations Manager"
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (v4/v6 line: KGP removed for AGP 9 built-in Kotlin)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2
  flutter_local_notifications: ^22.1.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0

  # Application foundation
  connectivity_plus: ^7.0.0
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.3
  go_router: ^17.0.1
  google_fonts: ^8.0.0
  http: ^1.4.0
  crypto: ^3.0.6

  # UI/UX polish: image caching, skeleton loaders, lightweight motion
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  image: ^4.5.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: 2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^13.2.1
  shared_preferences: ^2.5.4
  speech_to_text: ^7.5.0-beta.1
  flutter_tts: ^4.2.3
  timezone: ^0.11.1
  url_launcher: ^6.3.1
  uuid: ^4.5.2
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_performance: ^0.11.4+5
  mobile_scanner: ^7.4.0
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^9.1.0

dependency_overrides:
  # Avoids the objective_c native-assets hook, which is incompatible with a
  # Windows profile path containing spaces. This implementation is Apple-only.
  path_provider_foundation: 2.4.1
  # Vendored flutter_tts fork with the legacy Kotlin Gradle Plugin application
  # removed (AGP 9 built-in Kotlin). Remove once upstream ships a KGP-free build.
  flutter_tts:
    path: third_party/flutter_tts

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/SB icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/images/SB icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/SB icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/SB icon.png"

  color_dark: "#000000"
  image_dark: "assets/images/SB icon.png"

  android_12:
    color: "#000000"
    image: "assets/images/SB icon.png"
    color_dark: "#000000"
    image_dark: "assets/images/SB icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/Shading background/
