name: sabibom
description: "SabiBom - AI Business Operations Manager"
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  firebase_messaging: ^15.2.9
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0

  # Application foundation
  connectivity_plus: ^7.0.0
  flutter_riverpod: ^3.0.3
  flutter_svg: ^2.2.3
  go_router: ^17.0.1
  google_fonts: ^8.0.0
  intl: ^0.20.2
  path_provider: 2.1.5
  shared_preferences: ^2.5.4
  uuid: ^4.5.2

dependency_overrides:
  # Avoids the objective_c native-assets hook, which is incompatible with a
  # Windows profile path containing spaces. This implementation is Apple-only.
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/SB icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/images/SB icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/SB icon.png"

flutter_native_splash:
  color: "#F4F0FF"
  image: "assets/images/SB icon.png"

  color_dark: "#F4F0FF"
  image_dark: "assets/images/SB icon.png"

  android_12:
    color: "#F4F0FF"
    image: "assets/images/SB icon.png"
    color_dark: "#F4F0FF"
    image_dark: "assets/images/SB icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
